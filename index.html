<!DOCTYPE html>
<html>
<head>
    <title>Miray Cloud Project</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            text-align: center;
        }

        .container {
            padding: 100px 20px;
            animation: fadeIn 2s ease-in;
        }

        h1 {
            font-size: 50px;
            animation: slideDown 1.5s ease-out;
        }

        p {
            font-size: 20px;
        }

        .features p {
            margin-top: 10px;
            animation: fadeInUp 2s ease-in;
        }

        .btn {
            margin-top: 40px;
            padding: 15px 30px;
            font-size: 18px;
            background: white;
            color: #4facfe;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #333;
            color: white;
            transform: scale(1.1);
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        @keyframes slideDown {
            from {transform: translateY(-50px); opacity: 0;}
            to {transform: translateY(0); opacity: 1;}
        }

        @keyframes fadeInUp {
            from {transform: translateY(30px); opacity: 0;}
            to {transform: translateY(0); opacity: 1;}
        }
    </style>

    <script>
        function showMessage() {
            alert("🎉 This project is successfully running on the cloud!");
        }

        async function getUser() {
            const response = await fetch("https://randomuser.me/api/");
            const data = await response.json();

            const user = data.results[0];

            document.getElementById("user").innerHTML = `
                <h3>${user.name.first} ${user.name.last}</h3>
                <img src="${user.picture.large}" style="border-radius:50%;">
            `;
        }
    </script>

</head>

<body>

    <div class="container">
        <h1>☁️ Miray's Cloud Project</h1>
        <p>This website is hosted on the cloud using GitHub Pages</p>

        <div class="features">
            <p>🚀 Fast Deployment</p>
            <p>🌍 Accessible Everywhere</p>
            <p>💡 Simple & Powerful</p>
        </div>

        <button class="btn" onclick="showMessage()">Click Me 🚀</button>

        <button class="btn" onclick="getUser()">Get Random User 👤</button>

        <div id="user" style="margin-top:20px;"></div>

    </div>

</body>
</html>
